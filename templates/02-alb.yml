AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Application Load Balancer layer (02-alb) for the ECS Fargate platform.
  Provisions exactly one internet-facing ALB placed across all public subnets
  imported from the VPC template (spanning at least two Availability Zones) and
  associated with the ALB security group imported from the security group
  template. An HTTPS listener on 443 terminates TLS using the supplied ACM
  certificate and returns a default 503 fixed response (target groups attach
  later from the service stack). An HTTP listener on 80 permanently redirects
  (HTTP 301) to HTTPS on 443 while preserving the original host, path, and
  query string. The ALB ARN, DNS name, and HTTPS listener ARN are exported with
  environment-prefixed names.

# ---------------------------------------------------------------------------
# Parameters (Task 4.1) - Requirement 3.4
# ---------------------------------------------------------------------------
Parameters:
  Environment:
    Type: String
    Description: Deployment environment identifier; prefixes all export names.
    AllowedValues:
      - dev
      - prod

  CertificateArn:
    Type: String
    Description: >-
      ARN of the ACM certificate used by the HTTPS listener. Must be a
      syntactically valid ACM certificate ARN; empty values are rejected.
    # arn:aws:acm:<region>:<account-id>:certificate/<certificate-id>
    # The region and account-id segments are required and non-empty, and the
    # trailing certificate id is required, so an empty string is rejected
    # (Requirement 3.4).
    AllowedPattern: >-
      ^arn:aws:acm:[a-z0-9-]+:[0-9]{12}:certificate/[A-Za-z0-9-]+$
    ConstraintDescription: >-
      Must be a valid ACM certificate ARN of the form
      arn:aws:acm:<region>:<account-id>:certificate/<certificate-id>.

# ---------------------------------------------------------------------------
# Resources (Task 4.2) - Requirements 3.1, 3.2, 3.3, 3.5
# The public subnet list and ALB security group are imported from the VPC and
# security group templates; an unresolved import fails the operation before any
# resource is created or modified (Requirement 6.3).
# ---------------------------------------------------------------------------
Resources:

  # --- Application Load Balancer -------------------------------------------
  # Internet-facing ALB placed across all imported public subnets. The
  # PublicSubnetIds export is a comma-delimited string, so it is split back into
  # a list via Fn::Split for the Subnets property. Spanning every public subnet
  # guarantees coverage of at least two Availability Zones (Requirements 3.1,
  # 3.2).
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${Environment}-alb"
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Split
        - ","
        - Fn::ImportValue: !Sub "${Environment}-PublicSubnetIds"
      SecurityGroups:
        - Fn::ImportValue: !Sub "${Environment}-AlbSecurityGroupId"
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-alb"
        - Key: Environment
          Value: !Ref Environment

  # --- HTTPS listener (port 443) -------------------------------------------
  # Terminates TLS using the supplied ACM certificate. The default action is a
  # 503 fixed response; the service stack attaches target groups via listener
  # rules later (Requirement 3.3).
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "503"
            ContentType: text/plain
            MessageBody: >-
              No target group is registered for this host. Service unavailable.

  # --- HTTP listener (port 80) ---------------------------------------------
  # Permanently redirects (HTTP 301) all traffic to HTTPS on 443, preserving the
  # original host, path, and query string via the #{host}, #{path}, and #{query}
  # placeholders (Requirement 3.5).
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            Host: "#{host}"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301

# ---------------------------------------------------------------------------
# Outputs / Exports (Task 4.3) - Requirements 3.6, 6.2
# Every Export.Name is prefixed with "${Environment}-" so dev and prod never
# collide within the same account/region.
# ---------------------------------------------------------------------------
Outputs:
  AlbArn:
    Description: The Application Load Balancer ARN.
    Value: !Ref LoadBalancer
    Export:
      Name: !Sub "${Environment}-AlbArn"

  AlbDnsName:
    Description: The Application Load Balancer DNS name.
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub "${Environment}-AlbDnsName"

  HttpsListenerArn:
    Description: The HTTPS (443) listener ARN.
    Value: !Ref HttpsListener
    Export:
      Name: !Sub "${Environment}-HttpsListenerArn"
